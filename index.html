<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Cricket Score</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>const ROLE='fans'</script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1e6;--card:#fffefa;--ink:#16221a;--mute:#66705f;--line:#e2dccb;--g:#14532d;--g2:#1f7a43;--lime:#c6f36b;--r:#d62f2f;--b:#1d63d6;--p:#7b3fe4;--am:#e89b0c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1710;--card:#16231a;--ink:#eef3e6;--mute:#9db095;--line:#28392c;--g:#0f3d22;--g2:#2c9a58}}
:root[data-theme="dark"]{--bg:#0e1710;--card:#16231a;--ink:#eef3e6;--mute:#9db095;--line:#28392c;--g:#0f3d22;--g2:#2c9a58}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px 14px 40px}
h1,h2,.num{font-family:'Barlow Condensed',Impact,sans-serif;margin:0}
button{font:inherit;font-weight:600;border:0;border-radius:14px;cursor:pointer;color:var(--ink);background:var(--card);border:1.5px solid var(--line)}
button:disabled{opacity:.4}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;width:100%}
.hero{background:linear-gradient(160deg,var(--g),var(--g2));color:#fff;border-radius:22px;padding:18px;margin-bottom:12px}
.live{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.1em;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--lime);animation:p 1.4s infinite}@keyframes p{50%{opacity:.25}}
.big{font-size:76px;font-weight:700;line-height:1;margin:8px 0 2px}.big small{font-size:34px;opacity:.8}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.balls{display:flex;gap:7px;flex-wrap:wrap}
.bl{min-width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 16px 'Barlow Condensed',sans-serif;background:var(--line);color:var(--ink);padding:0 7px}
.c4{background:var(--b);color:#fff}.c6{background:var(--p);color:#fff}.cw{background:var(--r);color:#fff}.cx{background:var(--am);color:#2a1d00}
.need{font-size:19px;font-weight:600;margin-top:8px}
.stats{display:flex;gap:20px;margin-top:10px;font-size:14px;opacity:.95}.stats b{font-size:20px;display:block}
.bars{display:flex;align-items:flex-end;gap:5px;height:90px}
