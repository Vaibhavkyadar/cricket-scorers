<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Cricket Score</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="config.js"></script>
<script>const ROLE='fans'</script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1e6;--card:#fffefa;--ink:#16221a;--mute:#66705f;--line:#e2dccb;--g:#14532d;--g2:#1f7a43;--lime:#c6f36b;--r:#d62f2f;--b:#1d63d6;--p:#7b3fe4;--am:#e89b0c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1710;--card:#16231a;--ink:#eef3e6;--mute:#9db095;--line:#28392c;--g:#0f3d22;--g2:#2c9a58}}
:root[data-theme="dark"]{--bg:#0e1710;--card:#16231a;--ink:#eef3e6;--mute:#9db095;--line:#28392c;--g:#0f3d22;--g2:#2c9a58}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 Barlow,system-ui,sans-serif}
main{max-width:520px;margin:0 auto;padding:14px 14px 40px}
h1,h2,.num{font-family:'Barlow Condensed',Impact,sans-serif;margin:0}
button{font:inherit;font-weight:600;border:0;border-radius:14px;cursor:pointer;color:var(--ink);background:var(--card);border:1.5px solid var(--line)}
button:disabled{opacity:.4}
input,select{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;width:100%}
.hero{background:linear-gradient(160deg,var(--g),var(--g2));color:#fff;border-radius:22px;padding:18px;margin-bottom:12px}
.live{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:700;letter-spacing:.1em;background:rgba(255,255,255,.18);padding:3px 10px;border-radius:99px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--lime);animation:p 1.4s infinite}@keyframes p{50%{opacity:.25}}
.big{font-size:76px;font-weight:700;line-height:1;margin:8px 0 2px}.big small{font-size:34px;opacity:.8}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);margin-bottom:8px}
.balls{display:flex;gap:7px;flex-wrap:wrap}
.bl{min-width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 16px 'Barlow Condensed',sans-serif;background:var(--line);color:var(--ink);padding:0 7px}
.c4{background:var(--b);color:#fff}.c6{background:var(--p);color:#fff}.cw{background:var(--r);color:#fff}.cx{background:var(--am);color:#2a1d00}
.need{font-size:19px;font-weight:600;margin-top:8px}
.stats{display:flex;gap:20px;margin-top:10px;font-size:14px;opacity:.95}.stats b{font-size:20px;display:block}
.bars{display:flex;align-items:flex-end;gap:5px;height:90px}
.bars div{flex:1;background:var(--g2);border-radius:5px 5px 0 0;position:relative;min-height:3px}
.bars span{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;color:var(--mute)}
.win{background:var(--lime);color:#14270a;border-radius:18px;padding:16px;font:700 26px 'Barlow Condensed',sans-serif;text-align:center;margin-bottom:12px}
.seg{display:flex;gap:6px;margin-bottom:12px}.seg button{flex:1;padding:10px}.seg .on{background:var(--g);color:#fff;border-color:var(--g)}
.runs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.runs button{height:74px;font:700 34px 'Barlow Condensed',sans-serif}
.runs .r4{background:var(--b);color:#fff;border-color:var(--b)}.runs .r6{background:var(--p);color:#fff;border-color:var(--p)}
.ex{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.ex button{padding:12px 2px;font-size:14px}
.ex .on{background:var(--am);color:#2a1d00;border-color:var(--am)}.ex .w.on{background:var(--r);color:#fff;border-color:var(--r)}
.hint{text-align:center;color:var(--mute);font-size:14px;min-height:20px;margin:8px 0}
.row{display:flex;gap:8px}.row>*{flex:1}
.pri{background:var(--g);color:#fff;border-color:var(--g);padding:14px}
.f{margin-bottom:12px}.f label{display:block;font-size:13px;font-weight:600;color:var(--mute);margin-bottom:4px}
.empty{text-align:center;color:var(--mute);padding:60px 16px}.empty .n{font-size:56px}
.sm{font-size:14px;color:var(--mute)}
.hm{padding:10px 0;border-top:1px solid var(--line)}.lbl+.hm{border:0}.row2{display:flex;justify-content:space-between;font-size:18px}.hm .x{float:right;padding:2px 8px;font-size:13px}
textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px;width:100%;margin-top:6px}
.pl{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:19px}.pl:last-child{border:0}.pl small{opacity:.6;font-size:14px}
.lock{pointer-events:none;opacity:.35}.chip{padding:9px 13px;border-radius:99px}
table{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:6px}th{text-align:right;font-size:12px;color:var(--mute);font-weight:600;padding:4px}td{text-align:right;padding:6px 4px;border-top:1px solid var(--line)}th:first-child,td:first-child{text-align:left}
.aw .a{display:flex;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}.aw .e{font-size:32px}
</style>
</head>
<body>
<main id="app"><div class="empty">Loading…</div></main>
<script>
const KEY='cricket.v1';
const LIVE=!FB.apiKey.startsWith('PASTE'),isS=()=>ROLE==='scorer';
let user=null,authReady=false,wmsg='',lerr='';
const werr=()=>{wmsg='Not saved. Sign in again as the scorer.';render()};
function setRole(){canScore=LIVE?(!!user&&isS()):isS()}
function fix(m){if(!m)return m;const arr=a=>Array.isArray(a)?a:Object.values(a||{}),g=(a,i)=>(a||[])[i];
 m.inn=[arr(g(m.inn,0)),arr(g(m.inn,1))];m.p=[arr(g(m.p,0)),arr(g(m.p,1))];m.bo=[arr(g(m.bo,0)),arr(g(m.bo,1))];m.cb=[g(m.cb,0)||'',g(m.cb,1)||''];m.t=arr(m.t);return m}
const nrm=m=>norm(fix(m));
const toRoster=v=>{const o={};(Array.isArray(v)?v:Object.values(v||{})).forEach(x=>{if(x&&x.n)o[x.n]=x.p?Object.values(x.p):[]});return o};
function loginView(){return`<h1 class="num" style="font-size:38px">Scorer login</h1><p class="sm">Only the authorised scorer can change the score.</p><div class="card"><div class="f"><label>Login ID</label><input id="lid" autocomplete="username" placeholder="scorer@club.com"></div><div class="f"><label>Password</label><input id="lpw" type="password" autocomplete="current-password"></div>${lerr?`<div class="sm" style="color:var(--r);margin-bottom:8px">${esc(lerr)}</div>`:''}<button class="pri" style="width:100%" data-login>Sign in</button></div>`}
let copen=null,hopen=null,H=[],href=null,perr='',R={},rref=null,M=null,ref=null,canScore=false,tab='score',mode={ex:'',w:false},setup=false,ready=false,noDb=false,hold=false;
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tot=b=>b.r+(b.t==='wd'||b.t==='nb'?1:0), legal=b=>b.t!=='wd'&&b.t!=='nb';
function st(m,i){const bl=m.inn[i]||[];let runs=0,wk=0,lg=0;const overs=[];
 for(const b of bl){const o=Math.floor(lg/6);(overs[o]=overs[o]||[]).push(b);runs+=tot(b);if(b.w)wk++;if(legal(b))lg++}
 return{runs,wk,lg,overs,ov:Math.floor(lg/6)+'.'+lg%6}}
const bat=(m,i)=>m.t[i===0?m.f:1-m.f];
const btI=(m,i)=>i===0?m.f:1-m.f,maxW=(m,i)=>Math.max(1,(m.n||11)-1),pn=(m,t,k)=>m.p[t][k]||'?';
const over=(m,i)=>{const s=st(m,i);return s.wk>=maxW(m,i)||s.lg>=m.o*6||(i===1&&s.runs>st(m,0).runs)};
function label(b){let s=b.t==='wd'?'Wd'+(b.r||''):b.t==='nb'?'Nb'+(b.r||''):b.t==='b'?'B'+b.r:b.t==='lb'?'LB'+b.r:String(b.r);
 if(b.w)s=(!b.t&&!b.r)?'W':s+'+W';return s}
const cls=b=>b.w?'cw':b.t?'cx':b.r===4?'c4':b.r===6?'c6':'';
function result(m){if(!m.done)return'';const a=st(m,0),b=st(m,1);
 if(b.runs>a.runs){const w=maxW(m,1)-b.wk;return`${bat(m,1)} won by ${w} wicket${w===1?'':'s'}`}
 if(b.runs===a.runs)return'Match tied';return`${bat(m,0)} won by ${a.runs-b.runs} runs`}

const mk=t=>{const a=String(t||'').split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);return a.length>=2?a.slice(0,15):Array.from({length:11},(_,k)=>'Player '+(k+1))};
function norm(m){if(!m)return m;if(!m.p)m.p=[[],[]];if(!m.n)m.n=11;
 if(!m.bo){m.bo=[0,1].map(i=>(m.p[btI(m,i)]||[]).slice());[0,1].forEach(i=>m.inn[i].forEach(b=>{if(typeof b.bw==='number')b.bw=(m.p[1-btI(m,i)]||[])[b.bw]||'?'}));m.cb=['','']}
 if(!m.cb)m.cb=['',''];return m}
const ov6=b=>Math.floor(b/6)+'.'+b%6;
function rep2(m,i){const bt=btI(m,i);let sk=0,ns=1,nx=2,lg=0;const B={},W={};
 for(const x of m.inn[i]){const q=B[sk]=B[sk]||{r:0,b:0,f:0,s:0,o:0};const bw=x.bw!=null?(W[x.bw]=W[x.bw]||{b:0,r:0,w:0}):{b:0,r:0,w:0};
  if(x.t===''||x.t==='nb'){q.r+=x.r;if(x.r===4)q.f++;if(x.r===6)q.s++}
  if(x.t!=='wd')q.b++;
  bw.r+=(x.t==='b'||x.t==='lb')?0:tot(x);if(legal(x))bw.b++;
  if(x.w){bw.w++;q.o=1;sk=nx++}else if(x.r%2){const t=sk;sk=ns;ns=t}
  if(legal(x)){lg++;if(lg%6===0){const t=sk;sk=ns;ns=t}}}
 return{B,W,sk,ns,bt}}
function crease(m,i){const Q=rep2(m,i),bo=m.bo[i],g=k=>Q.B[k]||{r:0,b:0},w=m.cb[i]||'',bq=w?(Q.W[w]||{b:0,r:0,w:0}):null;if(Q.sk>=bo.length)return'';
 const row=(k,star)=>`<div class="pl"><span>${star?'<b>'+esc(bo[k])+' ★</b>':esc(bo[k])}</span><span class="num">${g(k).r} <small>(${g(k).b})</small></span></div>`;
 return`<div class="card"><div class="lbl">At the crease · ★ on strike</div>${row(Q.sk,1)}${Q.ns<bo.length?row(Q.ns,0):''}${bq?`<div class="pl"><span>🎯 ${esc(w)}</span><span class="num">${ov6(bq.b)}-${bq.r}-${bq.w}</span></div>`:''}</div>`}
function needs(m,i){const Q=rep2(m,i),n=m.bo[i].length;return{bat:[Q.sk,Q.ns].filter(k=>k>=n).sort((a,b)=>a-b),bw:!m.cb[i]}}
function promptCard(m,i){const nd=needs(m,i),bt=btI(m,i),ft=1-bt,bo=m.bo[i],used=bo.map(x=>x.toLowerCase());
 const sb=[...new Set([...(R[m.t[bt]]||[]),...m.p[bt]])].filter(x=>!used.includes(x.toLowerCase()));
 const bl=m.inn[i],lg=st(m,i).lg,prev=lg>0&&lg%6===0?bl[bl.length-1].bw:'';
 const sw=[...new Set([...(R[m.t[ft]]||[]),...m.p[ft]])].filter(x=>x!==prev);
 const fld=(id,l,ph)=>`<div class="f"><label>${l}</label><input id="${id}" placeholder="${ph}" autocomplete="off"></div>`;
 const ch=(a,k)=>a.length?`<div class="sm">Saved players · tap to pick</div><div class="balls" style="margin:6px 0 10px">${a.slice(0,14).map(n=>`<button class="chip" data-pick="${k}|${esc(n)}">${esc(n)}</button>`).join('')}</div>`:'';
 return`<div class="card"><div class="lbl">Enter names to continue</div>${nd.bat.map((k,x)=>fld('pb'+x,k===0?'Opening batter · on strike':k===1?'Opening batter · non-striker':'New batter coming in','Batter name')).join('')}${nd.bat.length?ch(sb,'b'):''}${nd.bw?fld('pbw','Bowler for this over','Bowler name')+ch(sw,'w'):''}${perr?`<div class="sm" style="color:var(--r);margin-bottom:8px">${esc(perr)}</div>`:''}<button class="pri" style="width:100%" data-conf>Confirm</button></div>`}
function scoreCard(m,i){const Q=rep2(m,i),bo=m.bo[i],ks=Object.keys(Q.B).map(Number),act=!m.done&&m.cur===i&&!over(m,i);
 if(Q.sk<bo.length&&!ks.includes(Q.sk))ks.push(Q.sk);if(Q.ns<bo.length&&!ks.includes(Q.ns))ks.push(Q.ns);ks.sort((a,b)=>a-b);
 const rows=ks.map(k=>{const q=Q.B[k]||{r:0,b:0,f:0,s:0,o:0};return`<tr><td>${esc(bo[k]||'?')}${act&&k===Q.sk?' ★':''}<div class="sm">${q.o?'out':'not out'}</div></td><td><b>${q.r}</b></td><td>${q.b}</td><td>${q.f}</td><td>${q.s}</td></tr>`}).join('');
 const wl=Object.keys(Q.W).map(k=>{const q=Q.W[k];return`<tr><td>${esc(k)}</td><td>${ov6(q.b)}</td><td>${q.r}</td><td><b>${q.w}</b></td></tr>`}).join('');
 return`<div class="card"><div class="lbl">${esc(bat(m,i))} innings</div><table><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th></tr>${rows}</table>${wl?`<table><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th></tr>${wl}</table>`:''}</div>`}
const scorecards=m=>[0,1].filter(i=>m.inn[i].length&&(m.done||i<=m.cur)).map(i=>scoreCard(m,i)).join('');
function awardsHTML(m){const P={},g=(t,n)=>P[t+'|'+n]||(P[t+'|'+n]={t,n,r:0,b:0,w:0,br:0,bb:0});
 for(const i of[0,1]){const Q=rep2(m,i);for(const k in Q.B){const nm=m.bo[i][+k];if(!nm)continue;const q=g(Q.bt,nm);q.r+=Q.B[k].r;q.b+=Q.B[k].b}for(const nm in Q.W){const q=g(1-Q.bt,nm);q.w+=Q.W[nm].w;q.br+=Q.W[nm].r;q.bb+=Q.W[nm].b}}
 const L=Object.values(P);if(!L.length)return'';
 const bb=[...L].sort((a,b)=>b.r-a.r||a.b-b.b)[0],bw=[...L].filter(p=>p.bb>0).sort((a,b)=>b.w-a.w||a.br-b.br)[0],pm=[...L].sort((a,b)=>(b.r+25*b.w)-(a.r+25*a.w))[0];
 const bs=p=>`${p.r} runs (${p.b} balls)`,ws=p=>`${p.w} wkt${p.w===1?'':'s'} for ${p.br} (${ov6(p.bb)} ov)`;
 const a=(e,t,p,txt)=>p?`<div class="a"><span class="e">${e}</span><div><div class="sm">${t}</div><b style="font-size:19px">${esc(p.n)}</b> <span class="sm">${esc(m.t[p.t])}</span><div>${txt}</div></div></div>`:'';
 return`<div class="card aw"><div class="lbl">Match awards</div>${a('🏅','Player of the match',pm,[pm.b?bs(pm):'',pm.bb?ws(pm):''].filter(Boolean).join(' · '))}${a('🏏','Best batting',bb,bs(bb))}${a('🎯','Best bowling',bw,bw?ws(bw):'')}</div>`}
function persistRoster(){if(rref)rref.set(Object.entries(R).map(([n,p])=>({n,p}))).catch(()=>{});else{try{localStorage.setItem('cricket.roster',JSON.stringify(R))}catch(e){}}}
function editView(m){const names=[...new Set([...m.bo[0],...m.bo[1],...m.inn[0].map(b=>b.bw),...m.inn[1].map(b=>b.bw)].filter(Boolean))];
 return`<div class="card"><div class="lbl">Fix a player name</div><p class="sm" style="margin:0 0 8px">Change a name and save. It updates the scorecard and your saved teams.</p>${names.length?names.map(n=>`<div class="f"><input data-old="${esc(n)}" value="${esc(n)}"></div>`).join('')+'<button class="pri" style="width:100%" data-savep>Save names</button>':'<div class="sm">Names appear here once you enter players.</div>'}</div>`}
const normH=v=>(Array.isArray(v)?v:Object.values(v||{})).filter(Boolean).map(h=>({...h,t:Object.values(h.t||{}),sc:Object.values(h.sc||{}),x:h.x?Object.values(h.x):undefined,sk:h.sk?Object.values(h.sk).map(c=>({...c,b:Object.values(c.b||{}),w:Object.values(c.w||{})})):undefined}));
function persistHist(){if(href)href.set(H).catch(werr);else{try{localStorage.setItem('cricket.hist',JSON.stringify(H))}catch(e){}}}
function awardsCalc(m){const P={},g=(t,n)=>P[t+'|'+n]||(P[t+'|'+n]={t,n,r:0,b:0,w:0,br:0,bb:0});
 for(const i of[0,1]){const Q=rep2(m,i);for(const k in Q.B){const nm=m.bo[i][+k];if(!nm)continue;const q=g(Q.bt,nm);q.r+=Q.B[k].r;q.b+=Q.B[k].b}for(const nm in Q.W){const q=g(1-Q.bt,nm);q.w+=Q.W[nm].w;q.br+=Q.W[nm].r;q.bb+=Q.W[nm].b}}
 const L=Object.values(P);return{bb:[...L].sort((a,b)=>b.r-a.r||a.b-b.b)[0],bw:[...L].filter(p=>p.bb>0).sort((a,b)=>b.w-a.w||a.br-b.br)[0],pm:[...L].sort((a,b)=>(b.r+25*b.w)-(a.r+25*a.w))[0]}}
function cardData(m,i){const Q=rep2(m,i),bo=m.bo[i],t=st(m,i),ks=Object.keys(Q.B).map(Number);
 if(Q.sk<bo.length&&!ks.includes(Q.sk))ks.push(Q.sk);if(Q.ns<bo.length&&!ks.includes(Q.ns))ks.push(Q.ns);ks.sort((a,b)=>a-b);
 return{t:bat(m,i),s:`${t.runs}/${t.wk} (${t.ov})`,b:ks.map(k=>{const q=Q.B[k]||{r:0,b:0,f:0,s:0,o:0};return{n:bo[k]||'?',r:q.r,b:q.b,f:q.f,s:q.s,o:q.o?1:0}}),w:Object.keys(Q.W).map(k=>{const q=Q.W[k];return{n:k,o:ov6(q.b),r:q.r,w:q.w}})}}
function syncHist(n){if(!n.id)n.id=Date.now();const i=H.findIndex(h=>h.id===n.id);
 if(n.done){const A=awardsCalc(n),a=st(n,0),b=st(n,1),e={id:n.id,t:[bat(n,0),bat(n,1)],sc:[`${a.runs}/${a.wk} (${a.ov})`,`${b.runs}/${b.wk} (${b.ov})`],res:result(n),kd:n.k||'reg',cn:n.c||'',wn:wnr(n),x:[0,1].map(i=>{const q=st(n,i);return{t:bat(n,i),r:q.runs,b:q.wk>=maxW(n,i)?n.o*6:q.lg}}),sk:[cardData(n,0),cardData(n,1)],pm:A.pm?A.pm.n:'',bb:A.bb?`${A.bb.n} ${A.bb.r}(${A.bb.b})`:'',bw:A.bw?`${A.bw.n} ${A.bw.w}/${A.bw.br}`:''};
  if(i>=0)H[i]=e;else H.unshift(e);H=H.slice(0,30);persistHist()}
 else if(i>=0){H.splice(i,1);persistHist()}}
const wnr=n=>{const a=st(n,0),b=st(n,1);return b.runs>a.runs?bat(n,1):b.runs<a.runs?bat(n,0):''};
function comps(){const o={};H.forEach(h=>{if(h.cn)o[h.cn]=h.kd});return Object.entries(o).map(([n,k])=>({n,k}))}
function kdFields(){const kv=(document.getElementById('kd')||{}).value||'reg',cs=comps();
 return`<div class="f"><label>Match type</label><select id="kd"><option value="reg" ${kv==='reg'?'selected':''}>Regular match</option><option value="ser" ${kv==='ser'?'selected':''}>Series</option><option value="tou" ${kv==='tou'?'selected':''}>Tournament</option></select></div>${kv==='reg'?'':`<div class="f"><label>${kv==='ser'?'Series name':'Tournament name'}</label><input id="cn" placeholder="e.g. ${kv==='ser'?'Lions vs Tigers Series':'Summer Cup'}">${cs.length?`<div class="sm" style="margin-top:8px">Continue an existing one</div><div class="balls" style="margin-top:6px">${cs.map((c,i)=>`<button class="chip" data-cnpick="${i}">${esc(c.n)}</button>`).join('')}</div>`:''}</div>`}`}
const tb=c=>`<div class="lbl" style="margin:14px 0 4px">${esc(c.t)} · ${esc(c.s)}</div><table><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th></tr>${(c.b||[]).map(x=>`<tr><td>${esc(x.n)}<div class="sm">${x.o?'out':'not out'}</div></td><td><b>${x.r}</b></td><td>${x.b}</td><td>${x.f}</td><td>${x.s}</td></tr>`).join('')}</table>${(c.w||[]).length?`<table><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th></tr>${c.w.map(x=>`<tr><td>${esc(x.n)}</td><td>${x.o}</td><td>${x.r}</td><td><b>${x.w}</b></td></tr>`).join('')}</table>`:''}`;
function histList(L,del){return L.slice(0,30).map(h=>{const op=String(hopen)===String(h.id);return`<div class="hm">${del?`<button class="x" data-hdel="${h.id}">Delete</button>`:''}<div class="sm">${new Date(h.id).toLocaleDateString()}${h.cn?' · '+esc(h.cn):''}</div><div class="row2"><b>${esc(h.t[0])}</b><span class="num">${esc(h.sc[0])}</span></div><div class="row2"><b>${esc(h.t[1])}</b><span class="num">${esc(h.sc[1])}</span></div><div style="font-weight:600;color:var(--g2)">${esc(h.res)}</div>${h.pm?`<div class="sm">🏅 ${esc(h.pm)}${h.bb?' · 🏏 '+esc(h.bb):''}${h.bw?' · 🎯 '+esc(h.bw):''}</div>`:''}${h.sk?`<button class="sec" style="width:100%;margin-top:8px;padding:9px" data-hopen="${h.id}">${op?'Hide scorecard':'View scorecard'}</button>${op?h.sk.map(tb).join(''):''}`:''}</div>`}).join('')}
function histHTML(ex,del){const L=H.filter(h=>h.id!==ex);return L.length?`<div class="card"><div class="lbl">Recent matches</div>${histList(L,del)}</div>`:''}
function table(L){const T={},g=n=>T[n]||(T[n]={n,p:0,w:0,l:0,t:0,pts:0,rf:0,bf:0,ra:0,ba:0});
 L.forEach(h=>{if(!h.x||h.x.length<2)return;const[a,b]=h.x,A=g(a.t),B=g(b.t);A.p++;B.p++;A.rf+=a.r;A.bf+=a.b;A.ra+=b.r;A.ba+=b.b;B.rf+=b.r;B.bf+=b.b;B.ra+=a.r;B.ba+=a.b;
  if(h.wn===a.t){A.w++;B.l++;A.pts+=2}else if(h.wn===b.t){B.w++;A.l++;B.pts+=2}else{A.t++;B.t++;A.pts++;B.pts++}});
 return Object.values(T).map(r=>({...r,nrr:(r.bf?r.rf/(r.bf/6):0)-(r.ba?r.ra/(r.ba/6):0)})).sort((x,y)=>y.pts-x.pts||y.nrr-x.nrr)}
function eventsHTML(del){const G={};H.filter(h=>h.cn).forEach(h=>(G[h.cn]=G[h.cn]||{n:h.cn,k:h.kd,L:[]}).L.push(h));
 const cs=Object.values(G);if(!cs.length)return'<div class="empty"><div class="n">🏆</div>No series or tournaments yet.<br><span class="sm">Choose Series or Tournament when you start a match.</span></div>';
 return cs.map(c=>{const T=table(c.L),op=copen===c.n,two=T.length>1;
  const top=c.k==='ser'?`<div class="num" style="font-size:30px;margin:8px 0 2px">${T.length?esc(T[0].n)+' '+T[0].w+' – '+(two?T[1].w+' '+esc(T[1].n):'0'):''}</div><div class="sm">${c.L.length} match${c.L.length===1?'':'es'} played${T.some(r=>r.t)?' · includes a tie':''}</div>`
   :`<table><tr><th>Team</th><th>P</th><th>W</th><th>L</th><th>T</th><th>Pts</th><th>NRR</th></tr>${T.map(r=>`<tr><td>${esc(r.n)}</td><td>${r.p}</td><td>${r.w}</td><td>${r.l}</td><td>${r.t}</td><td><b>${r.pts}</b></td><td>${r.nrr>=0?'+':''}${r.nrr.toFixed(2)}</td></tr>`).join('')}</table><div class="sm">Win 2 pts · tie 1 pt · NRR = net run rate</div>`;
  return`<div class="card"><div class="lbl">${c.k==='tou'?'Tournament':'Series'}</div><h2 class="num" style="font-size:26px;margin:0">${esc(c.n)}</h2>${top}<button class="sec" style="width:100%;margin-top:10px;padding:9px" data-copen="${esc(c.n)}">${op?'Hide matches':'Show matches ('+c.L.length+')'}</button>${op?histList(c.L,del):''}</div>`}).join('')}
function mutate(fn){wmsg='';const n=clone(M);fn(n);syncHist(n);M=n;render();
 if(ref)ref.set(n).catch(werr);else{try{localStorage.setItem(KEY,JSON.stringify(n))}catch(e){}}}

// ---- live (public) view ----
function live(m){
 const i=m.cur,s=st(m,i),p=i===1?st(m,0):null,rate=s.lg?(s.runs/(s.lg/6)).toFixed(2):'0.00';
 const last=(s.overs[s.overs.length-1]||[]);const cur=s.lg%6===0&&s.lg>0?[]:last;
 let need='';
 if(i===1&&!m.done){const t=p.runs+1,n=t-s.runs,left=m.o*6-s.lg;need=`<div class="need">${esc(bat(m,1))} need ${n} run${n===1?'':'s'} from ${left} ball${left===1?'':'s'}</div>`}
 const rrr=i===1&&!m.done?(((p.runs+1-s.runs)/Math.max(1,(m.o*6-s.lg)/6)).toFixed(2)):null;
 const rows=s.overs.map(o=>o.reduce((a,b)=>a+tot(b),0)),mx=Math.max(8,...rows);
 return`${m.done?`<div class="win">🏆 ${esc(result(m))}</div>`+awardsHTML(m):''}
 <div class="hero"><span class="live">${m.done?'FULL TIME':'<i></i> LIVE'}</span>
 <div style="margin-top:10px;font-size:18px;opacity:.9">${esc(bat(m,i))} batting${i===1?` · chasing ${st(m,0).runs+1}`:''}</div>
 <div class="big num">${s.runs}<small>/${s.wk}</small></div>
 <div style="font-size:20px">${s.ov} <span style="opacity:.7">of ${m.o} overs</span></div>${need}
 <div class="stats"><div><b>${rate}</b>Run rate</div>${rrr?`<div><b>${rrr}</b>Needed rate</div>`:''}<div><b>${maxW(m,i)-s.wk}</b>Wickets left</div></div></div>
 <div class="card"><div class="lbl">This over</div><div class="balls">${cur.length?cur.map(b=>`<span class="bl ${cls(b)}">${label(b)}</span>`).join(''):'<span class="sm">New over starting…</span>'}</div></div>
 ${m.done||over(m,i)?'':crease(m,i)}
 ${rows.length?`<div class="card"><div class="lbl">Runs per over</div><div class="bars" style="margin-top:20px">${rows.map((r,k)=>`<div style="height:${Math.max(4,r/mx*100)}%" title="Over ${k+1}"><span>${r}</span></div>`).join('')}</div><div class="sm" style="margin-top:6px">Over 1 → ${rows.length}</div></div>`:''}
 ${i===1?`<div class="card"><div class="lbl">First innings</div><b style="font-size:19px">${esc(bat(m,0))} ${p.runs}/${p.wk}</b> <span class="sm">(${p.ov} overs)</span></div>`:''}
 ${scorecards(m)}<div class="sm" style="text-align:center">Updates automatically · 4 <span style="color:var(--b)">●</span> 6 <span style="color:var(--p)">●</span> wicket <span style="color:var(--r)">●</span> extra <span style="color:var(--am)">●</span></div>`;
}

// ---- scorer ----
function scorer(m){
 const i=m.cur,s=st(m,i),ended=over(m,i)||m.done;
 const cur=(s.lg%6===0&&s.lg>0)?[]:(s.overs[s.overs.length-1]||[]);
 const name={wd:'Wide',nb:'No ball',b:'Bye',lb:'Leg bye'}[mode.ex];
 const nd0=ended?null:needs(m,i),need=!!(nd0&&(nd0.bat.length||nd0.bw));const hint=ended?(m.done?'Match finished.':'Innings complete.'):need?'Enter the names below to continue':(mode.ex||mode.w)?`${[name,mode.w?'Wicket':''].filter(Boolean).join(' + ')} → now tap the runs`:'Tap runs for each ball';
 return`<div class="hero" style="padding:14px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span>${esc(bat(m,i))} · Innings ${i+1}</span><span class="live">${m.done?'DONE':'<i></i> LIVE'}</span></div>
 <div class="big num" style="font-size:60px">${s.runs}<small>/${s.wk}</small> <span style="font-size:26px;opacity:.8">(${s.ov})</span></div></div>
 <div class="card"><div class="lbl">This over</div><div class="balls">${cur.length?cur.map(b=>`<span class="bl ${cls(b)}">${label(b)}</span>`).join(''):'<span class="sm">—</span>'}</div></div>
 ${ended?'':crease(m,i)}${need?promptCard(m,i):''}
 <div class="hint">${hint}</div><div class="${need?'lock':''}">
 <div class="runs">${[0,1,2,3,4,6].map(n=>`<button data-run="${n}" class="${n===4?'r4':n===6?'r6':''}" ${ended?'disabled':''}>${n}</button>`).join('')}</div>
 <div class="ex">${[['wd','Wide'],['nb','No ball'],['b','Bye'],['lb','Leg bye']].map(([k,l])=>`<button data-ex="${k}" class="${mode.ex===k?'on':''}" ${ended?'disabled':''}>${l}</button>`).join('')}<button data-w class="w ${mode.w?'on':''}" ${ended?'disabled':''}>Wicket</button></div>
 </div><div class="row" style="margin-top:14px"><button data-undo style="padding:14px" ${(!m.inn[0].length&&i===0)?'disabled':''}>↶ Undo last</button>
 ${m.done?'':ended?`<button class="pri" data-end>${i===0?'Start 2nd innings':'Finish match'}</button>`:`<button data-end style="padding:14px">${i===0?'End innings':'End match'}</button>`}</div>
 ${m.done?'<button class="pri" style="width:100%;margin-top:10px" data-new>Start a new match</button>':''}`;
}
function setupView(){const chips=s=>Object.keys(R).length?`<div class="sm">Saved teams · tap to load</div><div class="balls" style="margin:6px 0 8px">${Object.keys(R).map((n,i)=>`<button class="chip" data-tm="${s}|${i}">${esc(n)}</button>`).join('')}</div>`:'';
 return`<h1 class="num" style="font-size:38px">New match</h1><p class="sm">Takes 10 seconds. Everyone watching sees it update live.</p>
 <div class="card"><div class="f"><label>Team 1</label>${chips(0)}<input id="t0" placeholder="e.g. Royal Strikers"></div><div class="f"><label>Team 2</label>${chips(1)}<input id="t1" placeholder="e.g. City Lions"></div>
 ${kdFields()}<div class="f"><label>Players per team</label><select id="np">${[5,6,7,8,9,10,11].map(n=>`<option ${n===11?'selected':''}>${n}</option>`).join('')}</select></div><div class="f"><label>Overs per innings</label><select id="ov">${[2,5,6,10,15,20,30,50].map(n=>`<option ${n===10?'selected':''}>${n}</option>`).join('')}</select></div>
 <div class="f"><label>Batting first</label><select id="bf"><option value="0">Team 1</option><option value="1">Team 2</option></select></div>
 <button class="pri" style="width:100%" data-start>Start scoring</button></div>`;
}
function render(){const ids=['t0','t1','np','ov','bf','kd','cn','pb0','pb1','pbw'],sv=ids.map(i=>{const e=document.getElementById(i);return e?e.value:null});renderCore();ids.forEach((i,k)=>{const e=document.getElementById(i);if(e&&sv[k]!==null)e.value=sv[k]})}
function renderCore(){
 const a=document.getElementById('app');
 if(!ready||(LIVE&&isS()&&!authReady)){return}
 if(LIVE&&isS()&&!user){a.innerHTML=loginView();return}
 if(noDb){a.innerHTML='<div class="empty"><div class="n">🏏</div>Sign in to claude.ai to follow this match live.</div>';return}
 if(!M||(canScore&&setup)){
  a.innerHTML=(canScore?setupView():'<div class="empty"><div class="n">🏏</div><b>No match in progress</b><br>This page updates by itself when scoring starts.'+(LIVE?'':'<br><span class="sm">Demo mode: Firebase is not set up yet.</span>')+'</div>')+histHTML();return}
 const seg=canScore?`<div class="seg"><button data-tab="score" class="${tab==='score'?'on':''}">Score</button><button data-tab="live" class="${tab==='live'?'on':''}">Fans view</button><button data-tab="hist" class="${tab==='hist'?'on':''}">History</button><button data-tab="ev" class="${tab==='ev'?'on':''}">Events</button>${LIVE?'<button data-out>Sign out</button>':''}</div>`:`<div class="seg"><button data-tab="live" class="${tab!=='hist'?'on':''}">Live</button><button data-tab="hist" class="${tab==='hist'?'on':''}">History</button><button data-tab="ev" class="${tab==='ev'?'on':''}">Events</button></div>`;
 a.innerHTML=`${M.c?`<div class="sm" style="margin:2px 2px 0">${M.k==='tou'?'Tournament':'Series'} · ${esc(M.c)}</div>`:''}${wmsg?`<div class="card" style="color:var(--r)">${esc(wmsg)}</div>`:''}<h2 class="num" style="font-size:24px;margin:4px 2px 10px">${esc(M.t[0])} <span style="color:var(--mute)">vs</span> ${esc(M.t[1])}</h2>${seg}${tab==='ev'?eventsHTML(canScore):tab==='hist'?(histHTML(null,canScore)||'<div class="empty"><div class="n">📋</div>No finished matches yet.</div>'):canScore&&tab==='score'?scorer(M):live(M)}`;
}
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.tab){tab=d.tab;return render()}
 if(d.start!==undefined){const n=x=>document.getElementById(x).value.trim();
  const a=n('t0')||'Team 1',b=n('t1')||'Team 2';setup=false;tab='score';mode={ex:'',w:false};
  const m={t:[a,b],id:Date.now(),k:n('kd')||'reg',c:n('kd')&&n('kd')!=='reg'?n('cn'):'',o:+n('ov'),n:+n('np'),f:+document.getElementById('bf').value,inn:[[],[]],cur:0,done:false,p:[[...(R[a]||[])],[...(R[b]||[])]],bo:[[],[]],cb:['','']};M=m;R[a]=R[a]||[];R[b]=R[b]||[];persistRoster();render();
  if(ref)ref.set(m).catch(werr);else{try{localStorage.setItem(KEY,JSON.stringify(m))}catch(e){}}return}
 if(d.login!==undefined){const id=document.getElementById('lid').value.trim(),pw=document.getElementById('lpw').value;lerr='';firebase.auth().signInWithEmailAndPassword(id,pw).catch(()=>{lerr='Wrong ID or password.';render()});return}
 if(d.out!==undefined){firebase.auth().signOut();return}
 if(d.copen!==undefined){copen=copen===d.copen?null:d.copen;return render()}
 if(d.cnpick!==undefined){const c=comps()[+d.cnpick];document.getElementById('cn').value=c.n;document.getElementById('kd').value=c.k;return render()}
 if(d.hopen!==undefined){hopen=String(hopen)===d.hopen?null:d.hopen;return render()}
 if(d.hdel!==undefined){H=H.filter(h=>String(h.id)!==d.hdel);persistHist();return render()}
 if(d.tm!==undefined){const[sl,ix]=d.tm.split('|'),nm=Object.keys(R)[+ix];document.getElementById('t'+sl).value=nm;return}
 if(d.savep!==undefined){const mp={};document.querySelectorAll('[data-old]').forEach(e=>{const v=e.value.trim();if(v&&v!==e.dataset.old)mp[e.dataset.old]=v});tab='score';const f=a=>a.map(x=>mp[x]||x);
  mutate(m=>{m.bo=m.bo.map(f);m.p=m.p.map(f);m.cb=m.cb.map(x=>mp[x]||x);m.inn.forEach(a=>a.forEach(b=>{if(mp[b.bw])b.bw=mp[b.bw]}));[0,1].forEach(t=>{if(R[m.t[t]])R[m.t[t]]=[...new Set(f(R[m.t[t]]))]})});persistRoster();return}
 if(d.pick!==undefined){const k=d.pick.indexOf('|'),g=d.pick.slice(0,k),nm=d.pick.slice(k+1),els=(g==='b'?['pb0','pb1']:['pbw']).map(x=>document.getElementById(x)).filter(Boolean),e=els.find(x=>!x.value)||els[els.length-1];if(e)e.value=nm;return}
 if(d.conf!==undefined){const i=M.cur,nd=needs(M,i),bt=btI(M,i),ft=1-bt,bn=nd.bat.map((k,x)=>document.getElementById('pb'+x).value.trim()),wn=nd.bw?document.getElementById('pbw').value.trim():'',all=[...M.bo[i],...bn].map(x=>x.toLowerCase());perr='';
  if(bn.some(x=>!x))perr='Please enter the batter name.';else if(new Set(all).size!==all.length)perr='That batter is already in the team.';
  else if(nd.bw){const bl=M.inn[i],lg=st(M,i).lg,prev=lg>0&&lg%6===0?bl[bl.length-1].bw:'';if(!wn)perr='Please enter the bowler name.';else if(prev&&wn.toLowerCase()===prev.toLowerCase())perr='The same bowler can\u2019t bowl two overs in a row.'}
  if(perr)return render();
  mutate(m=>{bn.forEach(x=>m.bo[i].push(x));if(wn)m.cb[i]=wn;[[bt,bn],[ft,wn?[wn]:[]]].forEach(([t,a])=>{a.forEach(x=>{if(!m.p[t].some(y=>y.toLowerCase()===x.toLowerCase()))m.p[t].push(x)});R[m.t[t]]=[...new Set([...(R[m.t[t]]||[]),...m.p[t]])]})});persistRoster();return}
 if(d.new!==undefined){setup=true;return render()}
 if(!M)return;
 
 if(d.ex){mode.ex=mode.ex===d.ex?'':d.ex;return render()}
 if(d.w!==undefined){mode.w=!mode.w;return render()}
 if(d.run!==undefined){const r=+d.run,x={r,t:mode.ex,w:mode.w?1:0};mode={ex:'',w:false};
  mutate(m=>{if(m.done||over(m,m.cur)||!m.cb[m.cur]||needs(m,m.cur).bat.length)return;x.bw=m.cb[m.cur];m.inn[m.cur].push(x);if(legal(x)&&st(m,m.cur).lg%6===0)m.cb[m.cur]='';if(m.cur===1&&over(m,1))m.done=true});return}
 if(d.undo!==undefined){mode={ex:'',w:false};mutate(m=>{if(m.done)m.done=false;if(!m.inn[m.cur].length&&m.cur===1)m.cur=0;const x=m.inn[m.cur].pop();if(x&&x.bw!=null)m.cb[m.cur]=x.bw});return}
 if(d.end!==undefined){mutate(m=>{if(m.cur===0)m.cur=1;else m.done=true});return}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='lpw'){const b=document.querySelector('[data-login]');if(b)b.click()}});
window.addEventListener('hashchange',()=>{setRole();render()});
document.addEventListener('change',e=>{if(e.target.id==='kd')render()});
(async()=>{
 if(!LIVE){setRole();try{R=JSON.parse(localStorage.getItem('cricket.roster')||'{}')}catch(e){}try{H=normH(JSON.parse(localStorage.getItem('cricket.hist')||'[]'))}catch(e){}try{M=nrm(JSON.parse(localStorage.getItem(KEY)||'null'))}catch(e){}ready=true;return render()}
 firebase.initializeApp(FB);const db=firebase.database(),auth=firebase.auth();
 ref=db.ref('match');href=db.ref('history');href.on('value',x=>{H=normH(x.val());render()},()=>{});
 ref.on('value',x=>{M=nrm(x.val());ready=true;render()},()=>{ready=true;render()});
 auth.onAuthStateChanged(u=>{user=u;authReady=true;setRole();
  if(u&&isS()&&!rref){rref=db.ref('roster');rref.on('value',x=>{R=toRoster(x.val());render()},()=>{})}
  if(!u&&rref){rref.off();rref=null}
  render()});
})();
</script>
